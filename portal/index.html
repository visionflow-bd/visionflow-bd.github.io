<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Vision Flow Portal</title>
  <link rel="icon" href="../logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=admin-inbox-20260922">
  <style>
    @media (max-width:600px) {
      .actions,.row-actions { flex-wrap:wrap; }
      .section-head .actions .button { flex:1 1 145px; }
      .record { flex-wrap:wrap; }
      .record > .row-actions { width:100%; padding-left:33px; justify-content:flex-start; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Vision Flow home">
      <img src="../logo.png" alt="Vision Flow">
      <span><strong>Vision Flow</strong><small>CLIENT PORTAL</small></span>
    </a>
    <div id="topActions" class="top-actions"></div>
  </header>
  <main id="view" class="page-shell" aria-live="polite">
    <section class="state-card"><span class="status-dot"></span><p>Opening your portal securely…</p></section>
  </main>
  <div id="modalLayer" class="modal-layer" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-button modal-close" type="button" data-action="close-modal" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./app.js?v=admin-controls-20260922"></script>
</body>
</html>
