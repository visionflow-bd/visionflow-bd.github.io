<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>VisionFlow Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2306b6d4'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23050810'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-family='Arial' font-size='26' font-weight='900' fill='url(%23g)'%3EVF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg-deep:#030610;--bg-dark:#070b18;--bg-card:rgba(15,23,42,.55);--bg-glass:rgba(255,255,255,.04);
--text-primary:#f8fafc;--text-secondary:#cbd5e1;--text-muted:#94a3b8;--text-dim:#64748b;
--border-light:rgba(255,255,255,.08);--border-mid:rgba(255,255,255,.14);--border-hover:rgba(255,255,255,.25);
--accent:#06b6d4;--accent-2:#8b5cf6;--accent-3:#3b82f6;
--gold:#fbbf24;--green:#10b981;--rose:#f43f5e;--orange:#f97316;
--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--max-w:1280px;
--transition:.3s cubic-bezier(.4,0,.2,1);
--gradient-1:linear-gradient(135deg,#06b6d4 0%,#3b82f6 50%,#8b5cf6 100%);
--shadow-md:0 8px 24px rgba(0,0,0,.4);--shadow-lg:0 20px 50px rgba(0,0,0,.5);
--nav-bg:rgba(3,6,16,.88);--auth-bg:rgba(0,0,0,.85);--modal-bg:rgba(0,0,0,.7);
--input-bg:rgba(255,255,255,.07);--input-border:rgba(255,255,255,.15);--input-color:#ffffff;
--card-shadow:none;--th-bg:rgba(6,182,212,.06);--scroll-bg:var(--bg-deep);--scroll-thumb:rgba(6,182,212,.3);
}
/* LIGHT THEME */
@media(prefers-color-scheme:light){:root{
--bg-deep:#f1f5f9;--bg-dark:#ffffff;--bg-card:rgba(255,255,255,.85);--bg-glass:rgba(0,0,0,.03);
--text-primary:#0f172a;--text-secondary:#334155;--text-muted:#64748b;--text-dim:#94a3b8;
--border-light:rgba(0,0,0,.07);--border-mid:rgba(0,0,0,.12);--border-hover:rgba(0,0,0,.2);
--nav-bg:rgba(255,255,255,.92);--auth-bg:rgba(241,245,249,.9);--modal-bg:rgba(0,0,0,.4);
--input-bg:#ffffff;--input-border:rgba(0,0,0,.15);--input-color:#0f172a;
--card-shadow:0 1px 4px rgba(0,0,0,.06);--th-bg:rgba(6,182,212,.05);--scroll-bg:#f1f5f9;--scroll-thumb:rgba(6,182,212,.25);
--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 12px 32px rgba(0,0,0,.12);
}body{background-image:radial-gradient(ellipse at 20% 80%,rgba(6,182,212,.03),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(139,92,246,.03),transparent 50%)}}

html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-deep);color:var(--text-secondary);
min-height:100vh;line-height:1.65;-webkit-font-smoothing:antialiased;
background-image:radial-gradient(ellipse at 20% 80%,rgba(6,182,212,.04),transparent 50%),
radial-gradient(ellipse at 80% 20%,rgba(139,92,246,.04),transparent 50%)}
a{color:var(--accent);text-decoration:none;transition:var(--transition)}a:hover{color:#22d3ee}
::selection{background:rgba(6,182,212,.3);color:#fff}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--scroll-bg)}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:3px}
.gt{background:var(--gradient-1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.gc{position:relative;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);
backdrop-filter:blur(18px);transition:var(--transition);overflow:hidden;box-shadow:var(--card-shadow)}
.gc::before{content:'';position:absolute;inset:0;background:radial-gradient(600px circle at var(--cx,50%) var(--cy,50%),rgba(6,182,212,.06),transparent 40%);pointer-events:none;opacity:0;transition:opacity .4s}
.gc:hover::before{opacity:1}.gc:hover{border-color:var(--border-hover);transform:translateY(-3px);box-shadow:var(--shadow-md)}
.nav{position:sticky;top:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(24px) saturate(1.6);
border-bottom:1px solid var(--border-light);padding:0 24px;height:60px;display:flex;align-items:center;gap:12px}
.nav-logo{cursor:pointer;transition:var(--transition)}
.nav-logo:hover{transform:scale(1.08)}
.nav-logo-img{height:38px;width:38px;border-radius:10px;object-fit:contain;padding:2px;filter:drop-shadow(0 0 12px rgba(6,182,212,.3))}
.nav .brand{font-family:'Outfit',sans-serif;font-size:17px;font-weight:700;color:var(--text-primary);letter-spacing:-.3px;cursor:pointer}
.nav .brand span{background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius-sm);
font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);border:1px solid var(--border-light);
background:var(--bg-glass);color:var(--text-secondary);font-family:'Inter',sans-serif;min-height:40px}
.btn:hover{border-color:var(--accent);background:rgba(6,182,212,.08);color:var(--text-primary);transform:translateY(-1px)}
.btn-p{background:var(--gradient-1);color:#fff;border:none;box-shadow:0 8px 28px rgba(6,182,212,.3)}
.btn-p:hover{opacity:.9;transform:translateY(-2px)}
.btn-d{background:rgba(244,63,94,.08);color:var(--rose);border-color:rgba(244,63,94,.2)}
.btn-sm{padding:6px 14px;font-size:11px;min-height:30px}
.btn-icon{padding:5px 8px;min-height:auto;border:none;background:none;color:var(--text-dim);font-size:13px}
.btn-icon:hover{color:var(--accent);background:rgba(6,182,212,.08);transform:none}
.btn-icon.danger:hover{color:var(--rose);background:rgba(244,63,94,.08)}
.pill{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border-light);
background:var(--bg-glass);color:var(--text-muted);cursor:pointer;transition:var(--transition)}
.pill:hover,.pill.on{background:rgba(6,182,212,.12);color:var(--accent);border-color:rgba(6,182,212,.3)}
.cnt{max-width:var(--max-w);margin:0 auto;padding:24px}
.page{display:none}.page.on{display:block}
.bc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);margin-bottom:8px;flex-wrap:wrap}
.bc a{color:var(--accent);cursor:pointer}.bc .sep{color:var(--text-dim)}
.auth-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;
background:var(--auth-bg);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.auth-box{background:var(--bg-dark);border:1px solid var(--border-mid);border-radius:var(--radius-lg);
padding:44px 40px;width:100%;max-width:400px;text-align:center;box-shadow:var(--shadow-lg);
position:relative;overflow:hidden;animation:modalIn .5s cubic-bezier(.4,0,.2,1)}
@keyframes modalIn{from{transform:translateY(30px) scale(.95);opacity:0}}
.auth-box::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
background:conic-gradient(from 180deg,transparent,rgba(6,182,212,.03),transparent 30%);animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-box>*{position:relative;z-index:1}
.auth-logo{text-align:center;margin:0 auto 24px}
.auth-logo-img{width:100px;height:100px;border-radius:20px;object-fit:contain;
filter:drop-shadow(0 0 30px rgba(6,182,212,.4))}
.auth-box h2{font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;color:var(--text-primary);margin-bottom:4px}
.auth-box .sub{font-size:12px;color:var(--text-dim);margin-bottom:22px}
.auth-box input{width:100%;padding:13px 16px;border-radius:var(--radius-sm);border:1px solid var(--input-border);
background:var(--input-bg);color:var(--input-color);font-size:14px;margin-bottom:10px;outline:none;transition:var(--transition);font-family:'Inter',sans-serif}
.auth-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(6,182,212,.12)}
.auth-box .err{color:var(--rose);font-size:11px;min-height:16px;margin:4px 0}
#loadScreen{position:fixed;inset:0;background:var(--bg-deep);display:flex;align-items:center;justify-content:center;z-index:500}
.load-logo{text-align:center}
.load-logo-img{width:120px;height:120px;border-radius:24px;object-fit:contain;
filter:drop-shadow(0 0 40px rgba(6,182,212,.5))}
@keyframes ldot{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.2);opacity:1}}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
.si{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);
padding:20px;text-align:center;backdrop-filter:blur(12px);transition:var(--transition);box-shadow:var(--card-shadow)}
.si:hover{border-color:var(--border-mid);transform:translateY(-2px)}
.si .v{font-size:26px;font-weight:800;font-family:'Outfit',sans-serif;line-height:1}
.si .l{font-size:8px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-top:6px;font-weight:600}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin:16px 0}
.cc{padding:24px;cursor:pointer}
.cc h3{font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:4px}
.cc p{font-size:12px;color:var(--text-dim)}
.cc .sr{display:flex;gap:16px;margin-top:14px}
.cc .mn{text-align:center;flex:1}.cc .mn .v{font-size:20px;font-weight:800;font-family:'Outfit'}
.cc .mn .l{font-size:8px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.sh{display:flex;align-items:center;gap:10px;margin:28px 0 14px}
.sh h2{font-family:'Outfit',sans-serif;font-size:clamp(1.1rem,3vw,1.35rem);font-weight:700;color:var(--text-primary)}
.sh::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border-mid),transparent)}
.pb{height:28px;background:var(--bg-glass);border-radius:14px;overflow:hidden;border:1px solid var(--border-light);margin:14px 0}
.pf{height:100%;border-radius:14px;background:var(--gradient-1);display:flex;align-items:center;justify-content:center;
font-size:11px;font-weight:700;color:#fff;min-width:40px;transition:width 1s ease;position:relative;overflow:hidden}
.pf::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.tw{overflow-x:auto;border-radius:var(--radius-md);border:1px solid var(--border-light);margin:12px 0;
-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) transparent}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}
th{background:var(--th-bg);color:var(--accent);padding:12px 10px;text-align:left;
font-size:9px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;white-space:nowrap;
font-family:'JetBrains Mono',monospace;position:sticky;top:0;z-index:2}
td{padding:10px;border-bottom:1px solid var(--border-light);color:var(--text-secondary)}
tr:hover{background:rgba(6,182,212,.02)}
.bg{display:inline-block;padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.bg.pending{background:rgba(100,116,139,.12);color:var(--text-dim)}
.bg.progress{background:rgba(251,191,36,.1);color:var(--gold)}
.bg.completed{background:rgba(16,185,129,.1);color:var(--green)}
.bg.delivered{background:rgba(6,182,212,.1);color:var(--accent)}
.bg.revision{background:rgba(249,115,22,.1);color:var(--orange)}
.bg.awaiting{background:rgba(244,63,94,.08);color:var(--rose)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.pc{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:18px;
backdrop-filter:blur(12px);box-shadow:var(--card-shadow)}
.pc .lb{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.pc .am{font-size:24px;font-weight:800;font-family:'Outfit'}
.ai{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);
padding:18px;margin:8px 0;display:flex;align-items:flex-start;gap:14px;backdrop-filter:blur(12px);transition:var(--transition);box-shadow:var(--card-shadow)}
.ai:hover{border-color:var(--border-mid)}
.ai .ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--accent);cursor:pointer;
display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition);font-size:14px}
.ai .ck:hover{background:rgba(6,182,212,.15)}.ai .ck.dn{background:var(--green);border-color:var(--green);color:#fff}
.ai .inf{flex:1}.ai .inf .tt{font-size:13px;font-weight:600;color:var(--text-primary)}
.ai .inf .mt{font-size:10px;color:var(--text-dim);margin-top:2px}
.tabs{display:flex;gap:8px;margin:20px 0 16px;padding:4px;background:var(--bg-glass);border-radius:var(--radius-md);border:1px solid var(--border-light)}
.tab{padding:14px 24px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;
border:none;background:none;border-radius:var(--radius-sm);transition:var(--transition);font-family:'Inter',sans-serif;flex:1;text-align:center;line-height:1.3}
.tab:hover{color:var(--text-secondary);background:var(--bg-glass)}.tab.on{color:var(--accent);background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.2);box-shadow:0 2px 8px rgba(6,182,212,.1)}
.tab-c{display:none}.tab-c.on{display:block}
.sc{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);
padding:28px;max-width:600px;margin:20px auto;text-align:center;backdrop-filter:blur(18px);box-shadow:var(--card-shadow)}
.sc h3{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:12px}
.terms{font-size:12px;color:var(--text-muted);text-align:left;line-height:1.9;max-height:200px;overflow-y:auto;
padding:16px;background:var(--bg-glass);border-radius:var(--radius-sm);margin:14px 0;border:1px solid var(--border-light)}
.scw{border:2px dashed rgba(6,182,212,.25);border-radius:var(--radius-md);margin:14px 0;background:rgba(0,0,0,.15);overflow:hidden}
canvas.sp{width:100%;height:180px;cursor:crosshair;touch-action:none}
.fr{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
.fr input,.fr select{background:var(--input-bg);border:1px solid var(--input-border);color:var(--input-color);
padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;outline:none;transition:var(--transition);font-family:'Inter',sans-serif}
.fr input:focus,.fr select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(6,182,212,.1)}
.fr input{flex:1;min-width:200px}
/* MODAL — FULL VIEWPORT BLUR */
.mo{position:fixed;inset:0;
background:rgba(2,6,18,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
display:none;align-items:center;justify-content:center;z-index:10000;padding:20px;overflow-y:auto}
.mo.sh{display:flex}
.ml{background:var(--bg-dark);border:1px solid var(--border-mid);border-radius:var(--radius-lg);
padding:28px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);
animation:modalIn .35s cubic-bezier(.4,0,.2,1);margin:auto}
.ml h3{font-family:'Outfit',sans-serif;color:var(--text-primary);margin-bottom:16px;font-size:18px}
.ml label{display:block;font-size:10px;color:var(--text-muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.ml input,.ml select,.ml textarea{width:100%;padding:10px 14px;border-radius:var(--radius-sm);
border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-color);
font-size:13px;outline:none;transition:var(--transition);font-family:'Inter',sans-serif}
.ml input:focus,.ml select:focus,.ml textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(6,182,212,.1)}
.ml textarea{min-height:80px;resize:vertical}
.ml .ma{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.uz{border:2px dashed var(--border-mid);border-radius:var(--radius-md);padding:18px;text-align:center;
cursor:pointer;transition:var(--transition);margin:10px 0;color:var(--text-dim);font-size:12px}
.uz:hover{border-color:var(--accent);color:var(--accent)}.uz input{display:none}
.toast{position:fixed;bottom:20px;right:20px;padding:14px 24px;border-radius:var(--radius-sm);
font-size:13px;font-weight:600;transform:translateY(100px);opacity:0;transition:.4s cubic-bezier(.4,0,.2,1);z-index:400;
backdrop-filter:blur(12px);border:1px solid var(--border-light);font-family:'Inter',sans-serif;max-width:400px}
.toast.sh{transform:translateY(0);opacity:1}
.toast.ok{background:rgba(16,185,129,.15);color:var(--green);border-color:rgba(16,185,129,.3)}
.toast.er{background:rgba(244,63,94,.15);color:var(--rose);border-color:rgba(244,63,94,.3)}
.hero{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);
padding:32px;margin:12px 0;backdrop-filter:blur(18px);position:relative;overflow:hidden;box-shadow:var(--card-shadow)}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gradient-1)}
.hero h1{font-family:'Outfit',sans-serif;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;color:var(--text-primary);margin-bottom:4px}
.hero p{font-size:13px;color:var(--text-dim)}
.ft{text-align:center;padding:24px;border-top:1px solid var(--border-light);margin-top:40px;font-size:11px;color:var(--text-dim)}
.copied-anim{animation:copiedPulse .6s ease}
@keyframes copiedPulse{0%{transform:scale(1)}30%{transform:scale(1.05)}100%{transform:scale(1)}}
.act-row{display:flex;gap:2px;justify-content:flex-end}
@media(max-width:768px){.nav{padding:0 14px;height:52px}.nav-logo{height:26px}.cnt{padding:14px}
.cg{grid-template-columns:1fr}.sg{grid-template-columns:repeat(3,1fr)}.pg{grid-template-columns:repeat(2,1fr)}
.fr{flex-direction:column}.fr input{width:100%}.ml{margin:10px}.hero{padding:22px}.tabs{overflow-x:auto}}
@media(max-width:480px){.sg{grid-template-columns:repeat(2,1fr)}.pg{grid-template-columns:1fr}
.si .v{font-size:22px}.pc .am{font-size:20px}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-logo" onclick="if(window.S&&window.S.admin)window.showDash()"><img src="../logo.png" alt="VisionFlow" class="nav-logo-img"></div>
<div class="brand" onclick="if(window.S&&window.S.admin)window.showDash()">Vision Flow <span>Portal</span></div>
<div class="nav-r" id="navR"></div></nav>

<div class="auth-overlay" id="authO" style="display:none"><div class="auth-box">
<div class="auth-logo"><img src="../logo.png" alt="VisionFlow" class="auth-logo-img"></div>
<h2>Admin Portal</h2><p class="sub">Sign in with your VisionFlow admin credentials</p>
<input type="email" id="aE" placeholder="Email" autocomplete="username">
<input type="password" id="aP" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
<button class="btn btn-p" onclick="doLogin()" style="width:100%;justify-content:center;margin-top:4px"><i class="fas fa-sign-in-alt"></i> Sign In</button>
<div class="err" id="aErr"></div></div></div>

<div id="loadScreen"><div style="text-align:center">
<div class="load-logo"><img src="../logo.png" alt="VisionFlow" class="load-logo-img"></div>
<h2 style="color:var(--text-primary);font-family:'Outfit',sans-serif;font-size:32px;font-weight:800;margin-top:24px;background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Vision Flow</h2>
<p style="color:var(--text-muted);font-size:14px;margin-top:8px;letter-spacing:3px;text-transform:uppercase;font-weight:600">Client Portal</p>
<div style="margin-top:28px;display:flex;justify-content:center;gap:8px">
<div style="width:10px;height:10px;border-radius:50%;background:var(--accent);animation:ldot 1.4s ease-in-out infinite"></div>
<div style="width:10px;height:10px;border-radius:50%;background:var(--accent-3);animation:ldot 1.4s ease-in-out .2s infinite"></div>
<div style="width:10px;height:10px;border-radius:50%;background:var(--accent-2);animation:ldot 1.4s ease-in-out .4s infinite"></div>
</div>
<p style="color:var(--text-dim);font-size:12px;margin-top:16px">Loading your portal...</p></div></div>
<script>setTimeout(()=>{const ls=document.getElementById('loadScreen');if(ls&&ls.style.display!=='none'){ls.style.display='none';const ao=document.getElementById('authO');if(ao)ao.style.display='flex'}},5000)</script>

<div class="page" id="pDash"><div class="cnt" id="dashCnt"></div></div>
<div class="page" id="pClient"><div class="cnt" id="clientCnt"></div></div>
<div class="page" id="pProj"><div class="cnt" id="projCnt"></div></div>
<div class="mo" id="mO" onclick="if(event.target===this)closeModal()"><div class="ml" id="mB"></div></div>
<div class="toast" id="tst"></div>
<div class="ft"><span style="font-size:10px;opacity:.5">Powered by</span> <strong>VisionFlow</strong> &middot; <a href="https://visionflow-bd.github.io/">visionflow-bd.github.io</a> &middot; <i class="fas fa-shield-halved" style="color:var(--accent)"></i> Secured</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const ADMIN_EMAIL="shihabjessore7@gmail.com";
const app=initializeApp({apiKey:"AIzaSyCFzQL7oBNA49r2xGh7DwiFmcTBFr1qqiM",authDomain:"visionflow-bd.firebaseapp.com",projectId:"visionflow-bd",storageBucket:"visionflow-bd.firebasestorage.app",messagingSenderId:"233587493754",appId:"1:233587493754:web:a9d064de81f356ab81e4c3"});
const auth=getAuth(app),db=getFirestore(app);
const CLD={cloud:"dohlemsrz",preset:"visionflow"};
const S={admin:false,u:null,clients:{},cc:null,cp:null,clientMode:false,clientToken:null};
window.S=S;
const $=s=>document.getElementById(s);
const STS=['pending','progress','completed','delivered','revision'];
const STL={pending:'Pending',progress:'In Progress',completed:'Completed',delivered:'Delivered',revision:'Revision',awaiting:'Awaiting'};
function toast(m,type='ok'){const t=$('tst');t.textContent=m;t.className='toast '+type+' sh';setTimeout(()=>t.classList.remove('sh'),3500)}
window.toast=toast;
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
window.esc=esc;
const params=new URLSearchParams(location.search);
const urlClient=params.get('c'),urlProject=params.get('p'),forceClient=params.get('view')==='client';

window.doLogin=async()=>{const btn=document.querySelector('.auth-box .btn-p');btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Signing in...';
try{await signInWithEmailAndPassword(auth,$('aE').value,$('aP').value);$('aErr').textContent=''}
catch(e){$('aErr').textContent='Invalid credentials';btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Sign In'}};
window.doLogout=()=>signOut(auth);

function updateNav(){if(S.admin){$('navR').innerHTML=`<div class="pill" onclick="showDash()" style="cursor:pointer"><i class="fas fa-home"></i> Dashboard</div>
<div class="pill on" style="background:rgba(6,182,212,.12);color:var(--accent);border-color:rgba(6,182,212,.3)"><i class="fas fa-shield-halved"></i> Admin</div>
<div class="pill" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></div>`}
else if(S.clientMode){$('navR').innerHTML=`<div class="pill on" style="background:rgba(139,92,246,.12);color:var(--accent-2);border-color:rgba(139,92,246,.3)"><i class="fas fa-eye"></i> Client View</div>`}}

onAuthStateChanged(auth,async u=>{S.u=u;const isAdmin=!!u&&!u.isAnonymous&&u.email===ADMIN_EMAIL;
if(forceClient&&urlClient){S.admin=false;S.clientMode=true;updateNav();await loadClientBySlug(urlClient);$('loadScreen').style.display='none';return}
S.admin=isAdmin;$('authO').style.display='none';
if(S.admin){updateNav();await loadAllClients();if(urlClient){S.cc=urlClient;if(urlProject){S.cp=urlProject;showProject()}else showClient()}else showDash();$('loadScreen').style.display='none'}
else if(urlClient){S.clientMode=true;updateNav();await loadClientBySlug(urlClient);$('loadScreen').style.display='none'}
else{$('authO').style.display='flex';$('loadScreen').style.display='none'}});

document.addEventListener('mousemove',e=>{document.querySelectorAll('.gc').forEach(c=>{const r=c.getBoundingClientRect();c.style.setProperty('--cx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');c.style.setProperty('--cy',((e.clientY-r.top)/r.height*100).toFixed(1)+'%')})});

async function loadAllClients(){try{const s=await getDocs(collection(db,'portal_clients'));S.clients={};s.forEach(d=>{const x=d.data();if(!x._deleted)S.clients[d.id]=x})}catch(e){toast('Error loading','er')}}
async function loadClientBySlug(slug){try{const q1=query(collection(db,'portal_public'),where('clientSlug','==',slug));
const snap=await getDocs(q1);if(snap.empty){toast('Client portal not published. Ask admin to share.','er');return}
let data=null,tid=null;snap.forEach(d=>{data=d.data();tid=d.id});S.clients={[slug]:data};S.cc=slug;S.clientToken=tid;
try{const sd=await getDoc(doc(db,'portal_public',tid,'sigs','main'));if(sd.exists())data._sig=sd.data()}catch(e){}
try{const cs=await getDocs(collection(db,'portal_public',tid,'confirms'));data._confirms={};cs.forEach(c=>{data._confirms[c.id]=c.data()})}catch(e){}
try{const fs=await getDocs(collection(db,'portal_public',tid,'feedback'));data._feedback={};fs.forEach(f=>{data._feedback[f.id]=f.data()})}catch(e){}
if(urlProject){S.cp=urlProject;showProject()}
else{const pk=data.projects?Object.keys(data.projects):[];if(pk.length===1){S.cp=pk[0];showProject()}else showClient()}}catch(e){toast('Access error','er')}}

async function saveClient(slug,data){data.lastUpdated=new Date().toISOString();await setDoc(doc(db,'portal_clients',slug),data,{merge:true});S.clients[slug]=data;
// Auto-publish to portal_public so client view stays in sync
if(data.accessToken){await publishToPublic(slug)}
toast('Saved!')}
async function publishToPublic(slug){const c=S.clients[slug];if(!c)return;
if(!c.accessToken){const a=new Uint8Array(12);crypto.getRandomValues(a);c.accessToken=Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}
await setDoc(doc(db,'portal_clients',slug),c);const pk=c.projects?Object.keys(c.projects):[];
const pub={...JSON.parse(JSON.stringify(c)),clientSlug:slug};if(pk.length)pub.defaultProject=pk[0];
delete pub.accessToken;await setDoc(doc(db,'portal_public',c.accessToken),pub);return slug}
async function submitSig(tid,d){await setDoc(doc(db,'portal_public',tid,'sigs','main'),d)}
async function submitConfirm(tid,aid,d){await setDoc(doc(db,'portal_public',tid,'confirms',aid),d)}
async function submitFeedback(tid,itemN,d){await setDoc(doc(db,'portal_public',tid,'feedback','item_'+itemN),d)}

function setUrl(c,p){const ps=new URLSearchParams();if(c)ps.set('c',c);if(p)ps.set('p',p);if(S.clientMode)ps.set('view','client');
history.replaceState(null,'',location.pathname+(ps.toString()?'?'+ps:''))}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(id).classList.add('on')}

// DASHBOARD
function showDash(){showPage('pDash');setUrl();
const cl=Object.entries(S.clients);let tp=0,tr=0,tpd=0;
cl.forEach(([,c])=>{if(c.projects)Object.values(c.projects).forEach(p=>{tp++;tr+=p.budget||0;(p.payments||[]).forEach(py=>tpd+=py.amount||0)})});
$('dashCnt').innerHTML=`<div class="sh"><h2><i class="fas fa-chart-line" style="color:var(--accent);margin-right:8px"></i>Dashboard</h2></div>
<div class="sg">${[[cl.length,'Clients','fa-users'],[tp,'Projects','fa-folder-open'],['৳'+tr.toLocaleString(),'Total Budget','fa-wallet'],['৳'+tpd.toLocaleString(),'Collected','fa-check-circle'],['৳'+(tr-tpd).toLocaleString(),'Due','fa-clock']].map(([v,l,ic])=>`<div class="si"><div class="v gt">${v}</div><div class="l"><i class="fas ${ic}" style="margin-right:3px"></i>${l}</div></div>`).join('')}</div>
<div class="sh"><h2><i class="fas fa-users" style="color:var(--accent-2);margin-right:8px"></i>Clients</h2><button class="btn btn-p btn-sm" onclick="openAddClient()" style="margin-left:auto"><i class="fas fa-plus"></i> Add Client</button></div>
<div class="cg">${cl.map(([slug,c])=>{const pc=c.projects?Object.keys(c.projects).length:0;let ti=0,di=0;
if(c.projects)Object.values(c.projects).forEach(p=>{(p.items||[]).forEach(i=>{ti++;if(['completed','delivered'].includes(i.s))di++})});
return`<div class="gc cc" onclick="S.cc='${slug}';showClient()"><h3><i class="fas fa-user" style="color:var(--accent);margin-right:6px;font-size:13px"></i>${esc(c.name)||slug}</h3>
<p>${esc(c.phone)||''} ${c.email?'• '+esc(c.email):''}</p>
<div class="sr"><div class="mn"><div class="v gt">${pc}</div><div class="l">Projects</div></div>
<div class="mn"><div class="v gt">${di}/${ti}</div><div class="l">Done</div></div>
<div class="mn"><div class="v" style="color:${c.accessToken?'var(--green)':'var(--text-dim)'}">${c.accessToken?'<i class="fas fa-check-circle"></i>':'—'}</div><div class="l">Published</div></div></div></div>`}).join('')||'<p style="color:var(--text-dim);padding:20px"><i class="fas fa-info-circle"></i> No clients yet.</p>'}</div>`}
window.showDash=showDash;

// CLIENT PAGE
function showClient(){showPage('pClient');setUrl(S.cc);
const c=S.clients[S.cc];if(!c){toast('Client not found','er');return}
const bc=S.admin?`<div class="bc"><a onclick="showDash()"><i class="fas fa-home"></i> Dashboard</a><span class="sep">/</span><span>${esc(c.name)||S.cc}</span></div>`:`<div class="bc"><span>${esc(c.name)||S.cc}</span></div>`;
const adminAct=S.admin?`<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-sm" onclick="shareClient('${S.cc}')"><i class="fas fa-link"></i> Share Link</button>
<button class="btn btn-sm" onclick="openEditClient('${S.cc}')"><i class="fas fa-pen"></i> Edit</button>
<button class="btn btn-sm" onclick="previewAsClient('${S.cc}')"><i class="fas fa-eye"></i> Preview</button>
<button class="btn btn-d btn-sm" onclick="deleteClient('${S.cc}')"><i class="fas fa-trash"></i></button></div>`:'';
const projects=c.projects?Object.entries(c.projects):[];
const projCards=projects.map(([slug,p])=>{const items=p.items||[];const done=items.filter(i=>['completed','delivered'].includes(i.s)).length;
const total=p.totalItems||items.length;const pct=total?Math.round(done/total*100):0;
return`<div class="gc cc" onclick="S.cp='${slug}';showProject()"><h3><i class="fas fa-film" style="color:var(--gold);margin-right:6px;font-size:13px"></i>${esc(p.name)||slug}</h3>
<p>${total} items • ৳${p.rate||0}/item • <span class="bg ${p.status||'active'}">${p.status||'active'}</span></p>
<div class="pb" style="margin:10px 0 4px"><div class="pf" style="width:${Math.max(pct,3)}%">${pct}%</div></div>
<div class="sr"><div class="mn"><div class="v" style="color:var(--green)">${done}</div><div class="l">Done</div></div>
<div class="mn"><div class="v" style="color:var(--text-dim)">${total-done}</div><div class="l">Left</div></div>
<div class="mn"><div class="v" style="color:var(--gold)">৳${(p.budget||0).toLocaleString()}</div><div class="l">Budget</div></div></div></div>`}).join('');
$('clientCnt').innerHTML=`${bc}<div class="hero"><h1><i class="fas fa-user" style="color:var(--accent);margin-right:8px"></i>${esc(c.name)||S.cc}</h1>
<p>${esc(c.phone)||''} ${c.email?'• '+esc(c.email):''}</p>${adminAct}</div>
<div class="sh"><h2><i class="fas fa-folder-open" style="color:var(--gold);margin-right:8px"></i>Projects</h2>
${S.admin?'<button class="btn btn-p btn-sm" onclick="openAddProject()" style="margin-left:auto"><i class="fas fa-plus"></i> Add</button>':''}</div>
<div class="cg">${projCards||'<p style="color:var(--text-dim);padding:20px"><i class="fas fa-info-circle"></i> No projects.'+(S.admin?' Click <strong>+ Add</strong>.':'')+'</p>'}</div>`}
window.showClient=showClient;

// PROJECT DETAIL
function showProject(){showPage('pProj');setUrl(S.cc,S.cp);
const c=S.clients[S.cc];if(!c||!c.projects||!c.projects[S.cp]){toast('Project not found','er');return}
const p=c.projects[S.cp],items=p.items||[],pays=p.payments||[],aprs=p.approvals||[];
const done=items.filter(i=>['completed','delivered'].includes(i.s)).length;
const prog=items.filter(i=>i.s==='progress').length;
const pend=items.filter(i=>i.s==='pending').length;
const aw=items.filter(i=>i.s==='awaiting').length;
const total=p.totalItems||items.length;const pct=total?Math.round(done/total*100):0;
const tPaid=pays.reduce((s,py)=>s+(py.amount||0),0);const tDue=(p.budget||0)-tPaid;

const bc=S.admin?`<div class="bc"><a onclick="showDash()"><i class="fas fa-home"></i> Dashboard</a><span class="sep">/</span>
<a onclick="showClient()">${esc(c.name)||S.cc}</a><span class="sep">/</span><span>${esc(p.name)||S.cp}</span></div>`:
`<div class="bc"><a onclick="showClient()">← ${esc(c.name)||S.cc}</a><span class="sep">/</span><span>${esc(p.name)||S.cp}</span></div>`;

const adminBtns=S.admin?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">
<button class="btn btn-sm" onclick="openEditProject()"><i class="fas fa-pen"></i> Edit</button>
<button class="btn btn-sm" onclick="openAddPayment()"><i class="fas fa-plus"></i> Payment</button>
<button class="btn btn-sm" onclick="openAddApproval()"><i class="fas fa-clipboard-check"></i> Approval</button>
<button class="btn btn-d btn-sm" onclick="deleteProject()" style="margin-left:auto"><i class="fas fa-trash"></i></button></div>`:'';

let payRows='',runT=0;
pays.forEach((py,i)=>{runT+=py.amount||0;
payRows+=`<tr><td style="font-weight:700;color:var(--accent)">${i+1}</td><td>${py.date||'—'}</td>
<td style="color:var(--green);font-weight:700">৳${(py.amount||0).toLocaleString()}</td>
<td>${esc(py.type)||''}</td><td>${esc(py.note)||''}</td>
<td>${py.proofUrl?`<a href="${py.proofUrl}" target="_blank" title="View proof"><img src="${py.proofUrl}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--border-light);vertical-align:middle"></a>`:''}</td>
<td style="font-weight:600">৳${runT.toLocaleString()}</td>
${S.admin?`<td><div class="act-row"><button class="btn-icon" onclick="event.stopPropagation();openEditPayment(${i})" title="Edit"><i class="fas fa-pen"></i></button>
<button class="btn-icon danger" onclick="event.stopPropagation();delPayment(${i})" title="Delete"><i class="fas fa-trash"></i></button></div></td>`:''}</tr>`});

const tokenId=S.clientToken;
let aprHtml=aprs.map((a,i)=>{const cid='apr_'+i;
const confirmed=a.confirmed||(c._confirms&&c._confirms[cid]);
return`<div class="ai"><div class="ck ${confirmed?'dn':''}" ${S.clientMode&&!confirmed&&tokenId?`onclick="confirmApr('${tokenId}','${cid}','${(a.title||'').replace(/'/g,'’')}')"`:''}>
${confirmed?'<i class="fas fa-check"></i>':''}</div><div class="inf"><div class="tt">${esc(a.title)||'Update #'+(i+1)}</div>
<div class="mt">${esc(a.desc)||''} • ${confirmed?'<span style="color:var(--green)"><i class="fas fa-check-circle"></i> Confirmed</span>':'<span style="color:var(--gold)">'+(S.admin?'Awaiting':'Click to confirm')+'</span>'}</div></div>
${S.admin?`<div class="act-row" style="flex-shrink:0">${confirmed?`<button class="btn-icon" onclick="resetApproval(${i})" title="Reset"><i class="fas fa-undo"></i></button>`:''}
<button class="btn-icon danger" onclick="delApproval(${i})" title="Delete"><i class="fas fa-trash"></i></button></div>`:''}</div>`}).join('');

let sigHtml='';
const hasSig=c._sig;
if(hasSig){sigHtml=`<div class="sc"><h3 style="color:var(--green)"><i class="fas fa-check-circle"></i> Agreement Signed</h3>
<p style="font-size:12px;color:var(--text-dim)">Signed ${new Date(hasSig.ts).toLocaleString()}</p>
<img src="${hasSig.img}" style="max-width:260px;margin:12px auto;display:block;border:1px solid var(--border-light);border-radius:var(--radius-sm)"></div>`}
else if(S.clientMode&&tokenId){sigHtml=`<div class="sc"><h3><i class="fas fa-file-signature" style="color:var(--accent);margin-right:6px"></i>Agreement</h3>
<div class="terms"><strong>PROJECT AGREEMENT — ${p.name||''}</strong><br><br>
By signing below, I confirm:<br><br>
1. <strong>Scope:</strong> ${total} deliverables at ৳${p.rate||0}/item<br>
2. <strong>Budget:</strong> ৳${(p.budget||0).toLocaleString()} BDT<br>
3. <strong>Timeline:</strong> As agreed<br>4. <strong>Quality:</strong> Per specifications<br>
5. <strong>Payment:</strong> Per milestones<br>6. <strong>IP Rights:</strong> Transfer upon full payment<br><br>
<em>Digital signature is legally binding. Timestamp and device info recorded.</em></div>
<div class="scw"><canvas class="sp" id="sigP"></canvas></div>
<p style="font-size:10px;color:var(--text-dim)">Draw signature (touch or mouse)</p>
<div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
<button class="btn btn-sm" onclick="clearSig()"><i class="fas fa-eraser"></i> Clear</button>
<button class="btn btn-p btn-sm" onclick="doSubmitSig('${tokenId}')"><i class="fas fa-check"></i> Submit</button></div></div>`}}

// TABLE with EDIT BUTTON (not row click)
const tableRows=items.map((v,i)=>{
const fb=c._feedback&&c._feedback['item_'+v.n];
return`<tr data-s="${v.s}">
<td style="font-weight:800;color:var(--accent);font-family:'JetBrains Mono',monospace">${String(v.n).padStart(3,'0')}</td>
<td style="font-weight:600;color:var(--text-primary)">${esc(v.b)||'—'}</td><td>${esc(v.t)||'—'}</td>
<td><span class="bg ${v.s}" ${S.admin?`onclick="cycleS(${i})" style="cursor:pointer" title="Click to cycle"`:''}>
${STL[v.s]||v.s}</span></td>
<td>${v.sd||'—'}</td><td>${v.dd||'—'}</td><td>${v.dur||'—'}</td>
<td>${v.dl?`<a href="${v.dl}" target="_blank"><i class="fas fa-external-link-alt"></i></a>`:'—'}</td>
<td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc((v.no||'')+(fb?' | Client: '+fb.text:''))}">${esc(v.no)||'—'}${fb?'<i class="fas fa-comment" style="color:var(--gold);margin-left:4px;font-size:9px" title="Client feedback"></i>':''}</td>
<td><div class="act-row">${S.admin?`<button class="btn-icon" onclick="openEditItem(${i})" title="Edit"><i class="fas fa-pen"></i></button>`:
(S.clientMode&&['completed','delivered'].includes(v.s)&&tokenId?`<button class="btn-icon" onclick="openClientFeedback(${v.n})" title="Feedback"><i class="fas fa-comment-dots" style="color:var(--gold)"></i></button>`:'')}</div></td></tr>`}).join('');

$('projCnt').innerHTML=`${bc}
<div class="hero"><h1><i class="fas fa-film" style="color:var(--gold);margin-right:8px"></i>${esc(p.name)||S.cp}</h1>
<p>${total} items • ৳${p.rate||0}/item • <span class="bg ${p.status||'active'}">${p.status||'active'}</span>${c.lastUpdated?' • <span style="font-size:11px;color:var(--text-dim)"><i class="fas fa-clock" style="margin-right:3px"></i>Updated '+new Date(c.lastUpdated).toLocaleDateString()+'</span>':''}</p>
${adminBtns}<div style="margin-top:8px"><button class="btn btn-sm" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> ${S.clientMode?'Download Report':'PDF'}</button></div></div>
<div class="tabs"><button class="tab on" onclick="switchTab('overview',this)"><i class="fas fa-chart-pie"></i> <strong>Overview</strong> <span style="font-size:10px;opacity:.6;display:block;font-weight:400">Stats, Payments, Approvals</span></button>
<button class="tab" onclick="switchTab('prodlog',this)"><i class="fas fa-list-ol"></i> <strong>Production Log</strong> <span style="font-size:10px;opacity:.6;display:block;font-weight:400">${total} Items — Full Details</span></button></div>
<div class="tab-c on" id="tab-overview"><div id="pdfZone">
<div class="sg">${[[done,'Done','fa-check-circle'],[prog,'Progress','fa-spinner'],[pend,'Pending','fa-clock'],[aw,'Awaiting','fa-hourglass-half'],[total,'Total','fa-layer-group'],[pct+'%','Complete','fa-chart-pie']].map(([v,l,ic])=>`<div class="si"><div class="v gt">${v}</div><div class="l"><i class="fas ${ic}" style="margin-right:3px"></i>${l}</div></div>`).join('')}</div>

// SIGNATURE
let sigCtx,sigDraw=false;
function initSigPad(cv){const rect=cv.parentElement.getBoundingClientRect();cv.width=rect.width;cv.height=180;
sigCtx=cv.getContext('2d');sigCtx.strokeStyle='#06b6d4';sigCtx.lineWidth=2.5;sigCtx.lineCap='round';sigCtx.lineJoin='round';
const gp=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};
const s=e=>{e.preventDefault();sigDraw=true;const p=gp(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y)};
const m=e=>{if(!sigDraw)return;e.preventDefault();const p=gp(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke()};
const u=()=>sigDraw=false;
cv.addEventListener('mousedown',s);cv.addEventListener('mousemove',m);cv.addEventListener('mouseup',u);cv.addEventListener('mouseleave',u);
cv.addEventListener('touchstart',s,{passive:false});cv.addEventListener('touchmove',m,{passive:false});cv.addEventListener('touchend',u)}
window.clearSig=()=>{if(sigCtx){const c=document.getElementById('sigP');sigCtx.clearRect(0,0,c.width,c.height)}};
window.doSubmitSig=async tid=>{const c=document.getElementById('sigP');if(!c||!sigCtx)return;
const d=sigCtx.getImageData(0,0,c.width,c.height).data;let has=false;for(let i=3;i<d.length;i+=4)if(d[i]>0){has=true;break}
if(!has){toast('Draw first','er');return}
await submitSig(tid,{img:c.toDataURL('image/png'),ts:Date.now(),device:navigator.userAgent,screen:screen.width+'x'+screen.height});
toast('Signature submitted!');await loadClientBySlug(S.cc);showProject()};

await saveClient(S.cc,c);closeModal();showClient()});

window.openEditProject=()=>{const c=S.clients[S.cc],p=c.projects[S.cp];if(!p)return;
openModal('Edit Project',`<label>Name</label><input id="mPN" value="${p.name||''}">
<label>Total Items</label><input id="mPT" type="number" value="${p.totalItems||0}">
<label>Rate (৳)</label><input id="mPR" type="number" value="${p.rate||0}">
<label>Budget (৳)</label><input id="mPB" type="number" value="${p.budget||0}">
<label>Status</label><select id="mPSt"><option ${p.status==='active'?'selected':''}>active</option>
<option ${p.status==='paused'?'selected':''}>paused</option><option ${p.status==='completed'?'selected':''}>completed</option></select>`,async()=>{
p.name=$('mPN').value;p.totalItems=parseInt($('mPT').value)||100;p.rate=parseInt($('mPR').value)||400;
p.budget=parseInt($('mPB').value)||40000;p.status=$('mPSt').value;await saveClient(S.cc,c);closeModal();showProject()})};

window.openAddPayment=()=>openModal('Record Payment',`<label>Date</label><input id="mPD" placeholder="26 Sept 2026">
<label>Amount (৳)</label><input id="mPA" type="number">
<label>Method</label><select id="mPT2"><option>Advance</option><option>Milestone</option><option>bKash</option><option>Nagad</option><option>Bank Transfer</option><option>Final</option></select>
<label>Note</label><input id="mPNo">
<label>Payment Screenshot</label><div class="uz" onclick="document.getElementById('proofF').click()"><input type="file" id="proofF" accept="image/*" onchange="prevProof(this)"><i class="fas fa-cloud-upload-alt"></i> Upload</div><div id="proofPrev"></div>`,
async()=>{const saveBtn=document.querySelector('.mo .btn-p');if(saveBtn){saveBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Saving...';saveBtn.style.pointerEvents='none'}
const c=S.clients[S.cc],p=c.projects[S.cp];if(!p.payments)p.payments=[];
let proofUrl='';const fi=document.getElementById('proofF');
if(fi&&fi.files[0]){toast('Uploading proof image...');proofUrl=await uploadCld(fi.files[0]);toast('Proof uploaded!')}
p.payments.push({date:$('mPD').value,amount:parseInt($('mPA').value)||0,type:$('mPT2').value,note:$('mPNo').value,proofUrl,recordedAt:Date.now()});
await saveClient(S.cc,c);closeModal();showProject()});

window.openEditPayment=i=>{const c=S.clients[S.cc],p=c.projects[S.cp],py=p.payments[i];if(!py)return;
openModal('Edit Payment #'+(i+1),`<label>Date</label><input id="mPD" value="${py.date||''}">
<label>Amount (৳)</label><input id="mPA" type="number" value="${py.amount||0}">
<label>Method</label><select id="mPT2">${['Advance','Milestone','bKash','Nagad','Bank Transfer','Final'].map(t=>`<option ${py.type===t?'selected':''}>${t}</option>`).join('')}</select>
<label>Note</label><input id="mPNo" value="${py.note||''}">
<label>Payment Screenshot</label><div class="uz" onclick="document.getElementById('proofF').click()"><input type="file" id="proofF" accept="image/*" onchange="prevProof(this)"><i class="fas fa-cloud-upload-alt"></i> Upload new</div>
<div id="proofPrev">${py.proofUrl?`<img src="${py.proofUrl}" style="width:80px;height:60px;object-fit:cover;border-radius:8px;margin-top:8px">`:''}</div>`,
async()=>{const saveBtn=document.querySelector('.mo .btn-p');if(saveBtn){saveBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Saving...';saveBtn.style.pointerEvents='none'}
py.date=$('mPD').value;py.amount=parseInt($('mPA').value)||0;py.type=$('mPT2').value;py.note=$('mPNo').value;
const fi=document.getElementById('proofF');if(fi&&fi.files[0]){toast('Uploading proof image...');py.proofUrl=await uploadCld(fi.files[0]);toast('Proof uploaded!')}
await saveClient(S.cc,c);closeModal();showProject()})};

window.openAddApproval=()=>openModal('Approval Request',`<label>Title</label><input id="mAT" placeholder="Week 1 Review">
<label>Description</label><textarea id="mAD" placeholder="Details..."></textarea>`,async()=>{
const c=S.clients[S.cc],p=c.projects[S.cp];if(!p.approvals)p.approvals=[];
p.approvals.push({title:$('mAT').value,desc:$('mAD').value,confirmed:false,createdAt:Date.now()});
await saveClient(S.cc,c);closeModal();showProject()});

async function uploadCld(file){const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLD.preset);
const r=await fetch(`https://api.cloudinary.com/v1_1/${CLD.cloud}/image/upload`,{method:'POST',body:fd});
const d=await r.json();return d.secure_url||d.url}
window.prevProof=f=>{if(f.files[0]){const r=new FileReader();r.onload=e=>$('proofPrev').innerHTML=`<img src="${e.target.result}" style="width:80px;height:60px;object-fit:cover;border-radius:8px;margin-top:8px">`;r.readAsDataURL(f.files[0])}};
</script>
</body>
