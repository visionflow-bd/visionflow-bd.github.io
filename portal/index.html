<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>A new address. The same Vision Flow. - Vision Flow Agency</title>
<style>
:root{color-scheme:light dark;--bg:#f3f7f6;--card:#ffffff;--ink:#142f37;--muted:#526b70;--line:#d8e5e1;--accent:#087e80;--wash:#deeeea}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:clamp(20px,5vw,64px);color:var(--ink);background:radial-gradient(ellipse at 15% 10%,var(--wash),transparent 65%),var(--bg);font:16px/1.65 Manrope,"Segoe UI",sans-serif}
main{width:100%;max-width:560px;padding:clamp(24px,6vw,52px);background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 70px #082b3310;overflow-wrap:anywhere}
.identity{display:flex;gap:14px;align-items:center}.identity img{width:56px;height:56px;object-fit:contain;border-radius:13px;background:#102536;flex:none}.name{font-size:15px;font-weight:750;letter-spacing:.015em}.tagline{font-size:12px;color:var(--muted);margin:2px 0 0}
.flow{height:3px;background:var(--line);overflow:hidden;border-radius:4px;margin:32px 0}.flow:after{content:"";display:block;width:40%;height:100%;background:var(--accent);animation:flow 1.8s ease-in-out infinite}
.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:750}h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(29px,6vw,40px);line-height:1.18;letter-spacing:-.035em;margin:12px 0 18px}p{margin:0;color:var(--muted)}.note{font-size:13px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}footer{font-size:11px;color:var(--muted);margin-top:28px}a{display:inline-block;color:var(--accent);font-weight:700;padding:10px 0;text-underline-offset:4px}a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
@keyframes flow{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
@media(prefers-color-scheme:dark){:root{--bg:#0b171e;--card:#12242c;--ink:#e6efed;--muted:#b2c7c9;--line:#2a444c;--accent:#6ed5ca;--wash:#163b3e}}
@media(prefers-reduced-motion:reduce){.flow:after{animation:none;transform:none;width:100%;opacity:.65}}
</style></head><body><main aria-labelledby="title">
<header class="identity"><img src="https://agency.visionflowgroup.com/logo-email-mark-solid.png?v=20261009-r9" alt="" width="56" height="56" referrerpolicy="no-referrer"><div><div class="name">Vision Flow Agency</div><p class="tagline">Creative, engineered. Secure by design.</p></div></header>
<div class="flow" aria-hidden="true"></div><section role="status" aria-live="polite"><div class="eyebrow">Our new home</div><h1 id="title">A new address. The same Vision Flow.</h1>
<p>Taking you to the right place at our new domain.</p></section>
<a id="continue" href="https://visionflowgroup.com/">Continue to Vision Flow</a><noscript><p>Automatic forwarding needs JavaScript. Use the link above to continue.</p></noscript>
<footer>Part of Vision Flow Group</footer></main><script>
(()=>{const p=location.pathname,h=location.hash,q=new URLSearchParams(location.search);q.delete('stay');q.delete('brand');let base='https://visionflowgroup.com/';if(/^\/portal(?:\/|$)/.test(p)||q.has('access'))base='https://portal.visionflowgroup.com/';else if(/^\/admin(?:\/|$)/.test(p)||h==='#admin')base='https://admin.visionflowgroup.com/';else if(h==='#courses')base='https://academy.visionflowgroup.com/';else if(/^#(?:services|portfolio|code|live|team|reviews|certifications|contact)$/.test(h))base='https://agency.visionflowgroup.com/';const dest=base+(q.size?'?'+q:'')+h;document.getElementById('continue').href=dest;location.replace(dest);})();
</script></body></html>
